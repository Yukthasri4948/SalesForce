<template>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🎓 Vishnu Placement Portal</h1>

            <p>
                Today's Date : {todayDate}
            </p>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <h2>
                Welcome to Vishnu Placement Portal
            </h2>
        </div>

        <!-- Student Information -->
        <div class="student-section">

            <h2>Student Information</h2>

            <p>
                <b>Student Name:</b> {studentName}
            </p>

            <p>
                <b>Roll Number:</b> {rollNumber}
            </p>

            <p>
                <b>Department:</b> {department}
            </p>

        </div>

        <!-- Placement Statistics -->
        <div class="statistics-section">

            <h2>Placement Statistics</h2>

            <div class="cards">

                <div class="card">
                    <h3>Companies</h3>
                    <p class="number">{companyCount}</p>
                </div>

                <div class="card">
                    <h3>Jobs</h3>
                    <p class="number">{jobCount}</p>
                </div>

                <div class="card">
                    <h3>Applications</h3>
                    <p class="number">{applicationCount}</p>
                </div>

            </div>

        </div>

        <!-- Welcome Button -->
        <div class="button-section">

            <lightning-button
                label="Show Welcome Message"
                variant="brand"
                onclick={handleWelcome}>
            </lightning-button>

            <p class="message">
                {welcomeMessage}
            </p>

        </div>

        <!-- Application Section -->
        <div class="application-section">

            <h2>Job Application</h2>

            <p class="status">
                Status : {applicationStatus}
            </p>

            <lightning-button
                label="Apply Now"
                variant="success"
                onclick={handleApply}>
            </lightning-button>

        </div>

    </div>

</template>
